name: publish

# Publishes to PyPI when a GitHub release is published. Uses PyPI trusted
# publishing: add this repository as a trusted publisher for the `gutsy`
# project on pypi.org once (workflow publish.yml, environment pypi), then set
# the repository variable PYPI_PUBLISH=true. No token is ever stored.
on:
  release:
    types: [published]

jobs:
  publish:
    if: vars.PYPI_PUBLISH == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@release/v1
