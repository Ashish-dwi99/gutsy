[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gutsy"
version = "0.2.1"
description = "Instinct-ize your Claude Code or Codex: text it on Telegram and it runs errands on your own computer. No new subscription."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Sankhya AI Labs" }]
keywords = ["instinct-alternative", "ai-agent", "personal-assistant", "telegram", "claude-code", "codex", "mcp", "browser-automation"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Communications :: Chat",
]
dependencies = [
  "httpx>=0.27.0",
  "keyring>=25.0.0",
  "websockets>=12.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0"]

[project.urls]
Homepage = "https://github.com/Ashish-dwi99/gutsy"
Issues = "https://github.com/Ashish-dwi99/gutsy/issues"
Chotu = "https://www.sankhyaailabs.com"

[project.scripts]
gutsy = "gutsy.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["gutsy*"]

[tool.setuptools.package-data]
gutsy = ["instructions/*.md", "browser_fill.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
